<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>玄明 · MystHiru</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/theme.css">
<style>
:root { --accent: #e8b4c8; --bg: #0f0b12; }
body { background: var(--bg); }
.accent { color: var(--accent); }
.hero { max-width: 720px; margin: 0 auto; min-height: 80vh; display: flex; align-items: center; padding: 40px 24px; }
.hero h1 { font-size: clamp(2.6rem, 6vw, 4.2rem); margin: 0 0 14px; letter-spacing: -0.04em; font-weight: 650; }
.hero p { color: rgba(255,255,255,0.45); font-size: 1.1rem; max-width: 520px; line-height: 1.7; }
.hero .tagline { color: var(--accent); margin-bottom: 10px; font-size: 0.9rem; letter-spacing: 0.15em; }
.hero .actions { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; }
.hero .actions a { padding: 9px 20px; border-radius: 999px; font-size: 0.95rem; font-weight: 500; transition: all .2s; }
.hero .actions a.primary { background: var(--accent); color: #0f0b12; }
.hero .actions a.primary:hover { opacity: .85; }
.hero .actions a.sec { border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.6); }
.hero .actions a.sec:hover { border-color: rgba(255,255,255,0.3); color: #fff; }
.hero .stats { display: flex; gap: 32px; margin-top: 40px; }
.hero .stats .num { font-size: 1.6rem; font-weight: 650; }
.hero .stats .lbl { font-size: 0.8rem; color: rgba(255,255,255,0.3); letter-spacing: 0.08em; }
.section { max-width: 720px; margin: 0 auto; padding: 60px 24px; border-top: 1px solid rgba(255,255,255,0.06); }
.section h2 { margin: 0 0 20px; }
.recent-list { display: grid; gap: 8px; }
.recent-item { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); text-decoration: none; transition: border-color .2s; }
.recent-item:hover { border-color: rgba(255,255,255,0.15); }
.recent-item .mark { font-size: 0.75rem; color: rgba(255,255,255,0.3); white-space: nowrap; }
.recent-item .title { color: rgba(255,255,255,0.7); }
.recent-item .date { font-size: 0.8rem; color: rgba(255,255,255,0.25); margin-left: auto; white-space: nowrap; }
@media (max-width: 640px) { .hero { min-height: auto; padding: 60px 16px 40px; } .section { padding: 40px 16px; } }
</style>
</head>
<body>
<nav><div class="nav-inner"><a class="nav-brand" href="index.html">MYSTHIRU</a><ul class="nav-links"><li><a class="active" href="index.html">首页</a></li><li><a href="about.html">关于</a></li><li><a href="projects.html">项目</a></li><li><a href="notes.html">随笔</a></li></ul></div></nav>

<div class="hero">
  <div>
    <div class="tagline">玄明 · MystHiru</div>
    <h1>写一点，做一点。</h1>
    <p>把灵感拆成代码，再把代码装回日常。追番、音乐与 AI 辅助开发，构成了大部分普通日常。</p>
    <div class="stats" id="home-stats">
      <div><div class="num" id="stat-notes">–</div><div class="lbl">NOTES</div></div>
      <div><div class="num" id="stat-projects">–</div><div class="lbl">PROJECTS</div></div>
      <div><div class="num" id="stat-collections">–</div><div class="lbl">ARCHIVE</div></div>
    </div>
    <div class="actions">
      <a class="primary" href="projects.html">看看项目</a>
      <a class="sec" href="https://t.me/MystHiru">Telegram</a>
    </div>
  </div>
</div>

<div class="section">
  <h2>最近更新</h2>
  <div class="recent-list" id="recent-updates"><p style="color:rgba(255,255,255,0.3);">读取中…</p></div>
</div>

<footer><p>© MystHiru · 更新得不快，但每一行都算数。</p></footer>
<script src="./assets/backtotop.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('./data/content.json?v=' + Date.now(), { cache: 'no-store' });
    const d = await r.json();
    const sn = document.getElementById('stat-notes'), sp = document.getElementById('stat-projects'), sc = document.getElementById('stat-collections');
    if (sn) sn.textContent = (d.notes || []).filter(x => x.published !== false).length;
    if (sp) sp.textContent = (d.projects || []).filter(x => x.published !== false).length;
    if (sc) sc.textContent = (d.collections || []).length;
    const items = [];
    (d.notes || []).filter(x => x.published !== false).forEach(n => items.push({ type: 'note', title: n.title, date: n.date, url: 'notes.html#' + (n.id || '') }));
    (d.projects || []).filter(x => x.published !== false).forEach(p => items.push({ type: 'project', title: p.name, date: '', url: p.url || 'projects.html' }));
    items.sort((a, b) => { if (a.date && b.date) return b.date.localeCompare(a.date); if (a.date) return -1; if (b.date) return 1; return a.title.localeCompare(b.title); });
    const top = items.slice(0, 5);
    const el = document.getElementById('recent-updates');
    if (top.length) {
      el.innerHTML = top.map(item => {
        const dat = item.date ? '<span class="date">' + item.date + '</span>' : '';
        const mark = item.type === 'note' ? '随笔' : '项目';
        return '<a class="recent-item" href="' + item.url + '"><span class="mark">' + mark + '</span><span class="title">' + item.title + '</span>' + dat + '</a>';
      }).join('');
    } else { el.innerHTML = '<p style="color:rgba(255,255,255,0.3);">还没有公开内容。</p>'; }
  } catch (e) { document.getElementById('recent-updates').innerHTML = '<p style="color:rgba(255,255,255,0.3);">读取失败</p>'; }
});
</script>
<script src="./assets/theme-switcher.js" defer></script>
</body></html>
