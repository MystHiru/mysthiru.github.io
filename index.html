<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玄明 · MystHiru</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --surface-4: #1E2636;
      --accent: #9D7BFF;
      --accent-muted: #6B5B95;
      --text-primary: #E8E8F0;
      --text-secondary: #A8A8B8;
      --text-dim: #6B6B7B;
      --line: #282C38;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 999px;
      --gap: clamp(1rem, 2.5vw, 1.5rem);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", Consolas, "Liberation Mono", monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    nav {
      background: var(--surface-1);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: var(--gap);
      padding: 1rem clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
    }
    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: var(--accent); }
    
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: center;
      padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .hero-content h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-content .subtitle {
      color: var(--text-secondary);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      margin-bottom: 2rem;
    }
    .hero-content p {
      color: var(--text-dim);
      max-width: 42ch;
      margin-bottom: 2rem;
    }
    .hero-image {
      position: relative;
      width: clamp(180px, 25vw, 280px);
      height: clamp(240px, 33vw, 380px);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9) saturate(1.1);
    }
    
    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-full);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--surface-0);
    }
    .btn-primary:hover {
      background: var(--accent-muted);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text-primary);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover {
      background: var(--surface-3);
      border-color: var(--accent-muted);
    }
    
    section {
      padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .section-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }
    .card {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent-muted); }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    
    footer {
      margin-top: auto;
      padding: 2rem clamp(1.5rem, 5vw, 3rem);
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    
    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .hero-image {
        margin: 0 auto;
        width: clamp(160px, 50vw, 220px);
        height: clamp(220px, 70vw, 300px);
      }
      .hero-content p { margin-left: auto; margin-right: auto; }
      .links { justify-content: center; }
      nav ul { flex-wrap: wrap; justify-content: center; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html" class="active">首页</a></li>
      <li><a href="about.html">关于</a></li>
      <li><a href="projects.html">项目</a></li>
      <li><a href="notes.html">随笔</a></li>
    </ul>
  </nav>
  
  <main>
    <div class="hero">
      <div class="hero-content">
        <h1>玄明 · MystHiru</h1>
        <p class="subtitle">把灵感拆成代码，再把代码装回日常。</p>
        <p>我喜欢追番、听音乐，也喜欢把突然冒出来的想法做成能运行的小东西。平时大多在代码、耳机和屏幕之间切换。</p>
        <div class="links">
          <a href="https://github.com/MystHiru" class="btn btn-primary">GitHub</a>
          <a href="https://t.me/MystHiru" class="btn btn-secondary">Telegram</a>
        </div>
      </div>
      <div class="hero-image">
        <img src="./img/character.svg" alt="原创二次元风格装饰插画">
      </div>
    </div>
    
    <section>
      <h2 class="section-title">最近在关注</h2>
      <div class="grid">
        <div class="card">
          <h3 style="margin-bottom:0.5rem;color:var(--accent);">📺 追番</h3>
          <p style="color:var(--text-secondary);font-size:0.95rem;">每季新番，以及让人记住的角色</p>
        </div>
        <div class="card">
          <h3 style="margin-bottom:0.5rem;color:var(--accent);">🎵 音乐</h3>
          <p style="color:var(--text-secondary);font-size:0.95rem;">适合通勤和深夜的音乐</p>
        </div>
        <div class="card">
          <h3 style="margin-bottom:0.5rem;color:var(--accent);">💻 开发</h3>
          <p style="color:var(--text-secondary);font-size:0.95rem;">Android、自动化与开源项目</p>
        </div>
        <div class="card">
          <h3 style="margin-bottom:0.5rem;color:var(--accent);">🤖 AI</h3>
          <p style="color:var(--text-secondary);font-size:0.95rem;">AI 辅助开发带来的新工作方式</p>
        </div>
      </div>
    </section>
  </main>
  
  <footer>
    <p>这里是玄明的记录页，更新得不快，但每一行都算数。</p>
  </footer>
</body>
</html>
