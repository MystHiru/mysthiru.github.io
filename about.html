<div class="about"><h1>你好，这里是玄明</h1><div class="tagline">把灵感拆成代码，再把代码装回日常。</div><p>日子大多在屏幕和耳机之间切换。写写代码，追追新番，偶尔也让 AI 替我写两行试试水。 <span class="kaomoji">(´-ω-`)</span></p><p>想法来得快去得也快，所以趁它们还在的时候，尽量做成能跑的东西。不追求每个项目都完整，但至少让它们从脑子的角落搬到了真实的世界里。</p><p>比起堆满标签和徽章，我更希望这里留下几件真正做过、也愿意继续维护的东西。 <span class="kaomoji">( ´ ▽ ` )</span></p><div class="recent-section"><h2>现在在做的事</h2><div class="recent-list" id="recent-list"><p style="color:rgba(255,255,255,.3);">读取中…</p></div></div><div class="links"><a href="https://github.com/MystHiru">GitHub</a><a href="https://t.me/MystHiru">Telegram</a></div><div class="deep-entry"><a href="gallery.html">Archive</a></div></div>
<footer><p>© MystHiru · 更新得不快，但每一行都算数。</p></footer>
<script src="./assets/backtotop.js" defer></script>
<script>
(async function(){try{const r=await fetch('./data/content.json?v='+Date.now(),{cache:'no-store'});const d=await r.json();const notes=(d.notes||[]).filter(x=>x.published!==false);const projects=(d.projects||[]).filter(x=>x.published!==false);const list=document.getElementById('recent-list');const items=[];notes.forEach(n=>items.push({type:'note',title:n.title,date:n.date,url:'notes.html#'+(n.id||'')}));projects.forEach(p=>items.push({type:'project',title:p.name,date:'',url:p.url||'projects.html'}));items.sort((a,b)=>{if(a.date&&b.date)return b.date.localeCompare(a.date);if(a.date)return -1;if(b.date)return 1;return a.title.localeCompare(b.title)});const top=items.slice(0,5);if(top.length){list.innerHTML=top.map(item=>{const dat=item.date?'<span class="date">'+item.date+'</span>':'';const mark=item.type==='note'?'随笔':'项目';return'<a class="recent-item" href="'+item.url+'"><span class="mark">'+mark+'</span><span class="title">'+item.title+'</span>'+dat+'</a>'}).join('')}else{list.innerHTML='<p style="color:rgba(255,255,255,.3);">还没有公开内容。</p>'}}catch(e){document.getElementById('recent-list').innerHTML='<p style="color:rgba(255,255,255,.3);">读取失败</p>'}})();
</script>
