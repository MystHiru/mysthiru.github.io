<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在 | MystHiru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: #0a0a1a;
            color: #e8e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 { width: 400px; height: 400px; background: #6C5CE7; top: -150px; right: -150px; }
        .orb-2 { width: 300px; height: 300px; background: #a29bfe; bottom: -100px; left: -100px; }
        .content { position: relative; z-index: 1; }
        h1 { font-size: clamp(6rem, 20vw, 12rem); font-weight: 900; background: linear-gradient(135deg, #a29bfe, #6C5CE7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .sub { font-size: 1.5rem; color: #a0a0c0; margin: 20px 0 40px; }
        p { color: #a0a0c0; max-width: 400px; margin-bottom: 40px; line-height: 1.8; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 32px; border-radius: 12px; font-size: 1rem;
            font-weight: 500; text-decoration: none; transition: all 0.3s;
            background: linear-gradient(135deg, #6C5CE7, #8b5cf6);
            color: white; box-shadow: 0 4px 20px rgba(108,92,231,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(108,92,231,0.4); }
        .ascii { color: #6C5CE7; font-family: 'Courier New', monospace; font-size: 0.8rem; margin-bottom: 30px; opacity: 0.5; white-space: pre; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="content">
        <div class="ascii">
  ╭─────────────────────╮
  │  404 · 夢の迷子    │
  ╰─────────────────────╯
        </div>
        <h1>404</h1>
        <div class="sub">✨ 页面在梦境中走丢了</div>
        <p>你寻找的页面不存在于这个世界<br>就像梦中的信使，飞向了未知的远方</p>
        <a href="/" class="btn">🏠 回到首页</a>
    </div>
</body>
</html>
