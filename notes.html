<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随笔 · 玄明</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./assets/theme.css"><style>
.layout{max-width:860px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:40px;align-items:start}.search{position:relative;margin-bottom:14px}.search input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:999px;color:#d4d0d8;padding:9px 14px 9px 34px;font-size:.9rem;outline:none}.search input:focus{border-color:var(--text-muted)}.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem}.search-count{font-size:.8rem;color:var(--text-muted);margin:0 0 14px}.note-list{display:grid;gap:14px}.note-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:20px 24px;scroll-margin-top:70px}.note-card.hidden{display:none}.note-card h3{margin:0 0 6px;font-size:1.1rem}.note-date{font-size:.8rem;color:var(--text-muted);margin-bottom:10px}.note-body{color:var(--text-dim);font-size:.95rem;line-height:1.75}.note-body>*+*{margin-top:12px}.note-body a{color:var(--accent)}.note-body code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:5px;font-size:.85rem}.note-body pre{overflow:auto;background:rgba(255,255,255,.05);padding:14px;border-radius:10px;font-size:.85rem}.toc{position:sticky;top:72px;border-left:1px solid rgba(255,255,255,.06);padding-left:16px}.toc-label{font-size:.7rem;letter-spacing:.12em;color:var(--text-muted);margin-bottom:12px}.toc-link{display:block;color:var(--text-dim);font-size:.85rem;line-height:1.5;padding:3px 0;text-decoration:none;transition:color .2s}.toc-link:hover,.toc-link.active{color:var(--accent)}.empty-state{color:var(--text-muted);padding:40px;text-align:center}.reading-progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:1000}.hl-keyword{color:var(--accent)}.hl-string{color:#7fd8a8}.hl-number{color:#f0b37e}.hl-comment{color:#666;font-style:italic}.hl-builtin{color:#8ab4ff}.hl-type{color:#d9a8f0}@media(max-width:700px){.layout{grid-template-columns:1fr}.toc{position:static;border-left:none;border-top:1px solid rgba(255,255,255,.06);padding:14px 0;margin-top:24px}.layout{padding:0 16px 60px}}
</style></head><body><div class="theme-decorations"></div>
<nav><div class="nav-inner"><a class="nav-brand" href="index.html">MYSTHIRU</a><ul class="nav-links"><li><a href="index.html">首页</a></li><li><a href="about.html">关于</a></li><li><a href="projects.html">项目</a></li><li><a class="active" href="notes.html">随笔</a></li></ul></div></nav>
<div class="page-header"><h1>随笔</h1><p>一些想法、碎片和不太成形的东西。</p></div>
<div class="reading-progress" id="reading-progress"></div>
<div class="layout"><div><div class="search"><span class="icon">🔍</span><input id="note-search" type="search" placeholder="搜索标题、正文或日期…" autocomplete="off"></div><div class="search-count" id="search-count"></div><div class="note-list" id="note-list" data-content-root><p class="empty-state">正在读取随笔…</p></div></div><aside class="toc" id="toc"><div class="toc-label">目录</div><div class="toc-list" id="toc-list"></div></aside></div>
<footer><p>© MystHiru · 更新得不快，但每一行都算数。</p></footer>
<script src="./assets/content.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('note-search'),c=document.getElementById('search-count'),t=document.getElementById('toc-list');let n=[];const bt=()=>{if(!n.length){t.innerHTML='<span class="toc-link">暂无随笔</span>';return}t.innerHTML=n.map((c,i)=>{const h=c.querySelector('h3'),id=c.id||'n'+i;c.id=id;return'<a class="toc-link" href="#'+id+'" data-i="'+i+'">'+(h?h.textContent:'?')+'</a>'}).join('')};const w=setInterval(()=>{if(document.querySelectorAll('.note-card').length||!document.querySelector('#note-list .empty-state')){clearInterval(w);n=[...document.querySelectorAll('.note-card')];bt();const f=()=>{const q=s.value.trim().toLowerCase();let v=0;n.forEach(c=>{const m=!q||(c.textContent||'').toLowerCase().includes(q);c.classList.toggle('hidden',!m);if(m)v++});c.textContent=q?'找到 '+v+' 篇':n.length+' 篇';t.querySelectorAll('.toc-link').forEach(l=>{const i=+l.dataset.i;l.style.display=n[i]&&n[i].classList.contains('hidden')?'none':'block'})};s.addEventListener('input',f);f();const l=t.querySelectorAll('.toc-link');const o=new IntersectionObserver(e=>{e.forEach(e=>{if(e.isIntersecting){l.forEach(l=>l.classList.remove('active'));const a=t.querySelector('a[href="#'+e.target.id+'"]');if(a)a.classList.add('active')}})},{rootMargin:'-20% 0px -70% 0px'});n.forEach(c=>o.observe(c));const p=document.getElementById('reading-progress'),r=document.querySelector('.layout');if(p&&r){const u=()=>{const rect=r.getBoundingClientRect(),total=r.offsetHeight-window.innerHeight+rect.top,sc=window.scrollY-rect.top;rct=total>0?Math.min(100,Math.max(0,sc/total*100)):0;p.style.width=rct+'%'};window.addEventListener('scroll',u,{passive:true});u()}}},200)});
</script>
<script src="./assets/backtotop.js" defer></script>
<script src="./assets/theme-switcher.js" defer></script>
</body></html>
