.layout{max-width:860px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:40px;align-items:start}.search{position:relative;margin-bottom:16px}.search input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:999px;color:#d4d0d8;padding:10px 16px 10px 36px;font-size:.9rem;outline:none;transition:border-color .25s ease,background .25s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.search input:focus{border-color:rgba(var(--glow-1),.3);background:rgba(255,255,255,.05)}.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem}.search-count{font-size:.8rem;color:var(--text-muted);margin:0 0 16px;letter-spacing:.02em}.note-list{display:grid;gap:16px}.note-card{background:linear-gradient(145deg,rgba(var(--glow-1),.05),rgba(var(--glow-2),.02) 60%);border:1px solid rgba(var(--glow-1),.1);border-radius:14px;padding:22px 26px;scroll-margin-top:72px;transition:all .3s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,.08)}.note-card:hover{border-color:rgba(var(--glow-1),.2);box-shadow:0 4px 20px rgba(0,0,0,.12)}.note-card.hidden{display:none}.note-card h3{margin:0 0 6px;font-size:1.08rem}.note-date{font-size:.78rem;color:var(--text-muted);margin-bottom:12px;letter-spacing:.02em}.note-body{color:var(--text-dim);font-size:.95rem;line-height:1.8}.note-body>*+*{margin-top:14px}.note-body a{color:var(--accent-bright)}.note-body code{background:rgba(255,255,255,.06);padding:2px 7px;border-radius:6px;font-size:.85rem}.note-body pre{overflow:auto;background:rgba(255,255,255,.04);padding:16px;border-radius:12px;font-size:.85rem;border:1px solid rgba(255,255,255,.06)}.toc{position:sticky;top:72px;border-left:1px solid rgba(255,255,255,.06);padding-left:16px}.toc-label{font-size:.68rem;letter-spacing:.14em;color:var(--text-muted);margin-bottom:14px;text-transform:uppercase}.toc-link{display:block;color:var(--text-dim);font-size:.85rem;line-height:1.5;padding:4px 0;text-decoration:none;transition:color .2s}.toc-link:hover,.toc-link.active{color:var(--accent-bright)}.empty-state{color:var(--text-muted);padding:48px;text-align:center;font-size:.9rem}.reading-progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-alt));z-index:1000}.hl-keyword{color:var(--accent)}.hl-string{color:#7fd8a8}.hl-number{color:#f0b37e}.hl-comment{color:#666;font-style:italic}.hl-builtin{color:#8ab4ff}.hl-type{color:#d9a8f0}@media(max-width:700px){.layout{grid-template-columns:1fr}.toc{position:static;border-left:none;border-top:1px solid rgba(255,255,255,.06);padding:16px 0;margin-top:24px}.layout{padding:0 16px 60px}}

<script>
document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('note-search'),c=document.getElementById('search-count'),t=document.getElementById('toc-list');let n=[],debounceTimer;const bt=()=>{if(!n.length){t.innerHTML='<span class="toc-link">暂无随笔</span>';return}t.innerHTML=n.map((c,i)=>{const h=c.querySelector('h3'),id=c.id||'n'+i;c.id=id;return'<a class="toc-link" href="#'+id+'" data-i="'+i+'">'+(h?h.textContent:'?')+'</a>'}).join('')};const setup=()=>{n=[...document.querySelectorAll('.note-card')];bt();const f=()=>{const q=s.value.trim().toLowerCase();let v=0;n.forEach(c=>{const m=!q||(c.textContent||'').toLowerCase().includes(q);c.classList.toggle('hidden',!m);if(m)v++});c.textContent=q?'找到 '+v+' 篇':n.length+' 篇';t.querySelectorAll('.toc-link').forEach(l=>{const i=+l.dataset.i;l.style.display=n[i]&&n[i].classList.contains('hidden')?'none':'block'})};s.addEventListener('input',()=>{clearTimeout(debounceTimer);debounceTimer=setTimeout(f,300)});f();const l=t.querySelectorAll('.toc-link');const o=new IntersectionObserver(e=>{e.forEach(e=>{if(e.isIntersecting){l.forEach(l=>l.classList.remove('active'));const a=t.querySelector('a[href="#'+e.target.id+'"]');if(a)a.classList.add('active')}})},{rootMargin:'-20% 0px -70% 0px'});n.forEach(c=>o.observe(c));const p=document.getElementById('reading-progress'),r=document.querySelector('.layout');if(p&&r){const u=()=>{const rect=r.getBoundingClientRect(),total=r.offsetHeight-window.innerHeight+rect.top,sc=window.scrollY-rect.top;const pct=total>0?Math.min(100,Math.max(0,sc/total*100)):0;p.style.width=pct+'%'};window.addEventListener('scroll',u,{passive:true});u()}};document.addEventListener('myst:content-ready',setup);if(document.querySelectorAll('.note-card').length)setup()});
</script>
