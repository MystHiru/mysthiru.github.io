<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随笔 · 玄明</title>
<style>
:root{--s0:#05070c;--s1:#0a0d12;--s2:#0f131c;--s3:#161d2b;--a:#9d7bff;--am:#6b5b95;--tp:#e8e8f0;--ts:#a8a8b8;--td:#6b6b7b;--ln:#282c38;--r:16px;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--s0);color:var(--tp);font-family:var(--f);font-size:16px;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}a{color:inherit}nav{position:sticky;top:0;z-index:20;background:rgba(10,9,18,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}.site-nav-inner{max-width:1120px;margin:0 auto;padding:14px clamp(18px,5vw,44px);display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{color:var(--a);font-weight:700;letter-spacing:.12em;text-decoration:none}.site-nav-inner ul{display:flex;list-style:none;gap:clamp(12px,3vw,25px)}.site-nav-inner a:not(.brand){color:var(--ts);text-decoration:none;font-size:14px}.site-nav-inner a:hover,.site-nav-inner a.active{color:var(--a)}header{max-width:1120px;margin:0 auto;padding:clamp(48px,8vw,86px) clamp(18px,5vw,44px) 24px;width:100%}.eyebrow{color:var(--a);font-size:12px;letter-spacing:.14em;margin-bottom:12px}h1{font-size:clamp(34px,6vw,58px);line-height:1.08;letter-spacing:-.035em;font-weight:650}header p{color:var(--ts);max-width:590px;margin-top:18px;font-size:clamp(15px,2vw,17px)}.notes-layout{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:12px clamp(18px,5vw,44px) 70px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:clamp(24px,5vw,50px);align-items:start}.notes-main{min-width:0}.search-wrap{position:relative;max-width:460px;margin-bottom:12px}.search-wrap input{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:999px;color:var(--tp);padding:10px 14px 10px 36px;font-size:14px;font-family:var(--f)}.search-wrap input:focus{outline:none;border-color:var(--am)}.search-wrap .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--td);font-size:14px;pointer-events:none}.search-count{font-size:13px;color:var(--td);margin:0 0 20px;min-height:1.5em}.note-list{display:grid;gap:16px}.note-card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:20px 24px;transition:border-color .2s;scroll-margin-top:90px}.note-card.hidden{display:none}.note-card:hover{border-color:var(--am)}.note-card h3{color:var(--a);font-size:20px;font-weight:600;margin-bottom:8px;line-height:1.35}.note-date{color:var(--td);font-size:13px;margin-bottom:14px}.note-body{color:var(--ts);font-size:15px;line-height:1.7}.note-body>*+*{margin-top:14px}.note-body a{color:var(--a)}.note-body code{background:var(--s2);padding:2px 6px;border-radius:5px;font-size:14px}.note-body pre{overflow:auto;background:var(--s2);padding:16px;border-radius:10px;font-size:14px}.note-body blockquote{border-left:3px solid var(--a);padding-left:16px;color:var(--ts)}.note-body ul{padding-left:20px}.empty-state{color:var(--td);padding:40px 0;text-align:center}.toc{position:sticky;top:90px;border-left:1px solid var(--ln);padding-left:18px}.toc-label{font-size:11px;letter-spacing:.12em;color:var(--td);margin-bottom:14px}.toc-list{display:grid;gap:6px}.toc-link{display:block;color:var(--ts);text-decoration:none;font-size:13px;line-height:1.45;padding:4px 0;transition:color .2s}.toc-link:hover,.toc-link.active{color:var(--a)}.toc-empty{color:var(--td);font-size:13px}.reading-progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--am));z-index:1000;border-radius:0 3px 3px 0}
footer{margin-top:auto;padding:24px clamp(18px,5vw,44px);border-top:1px solid var(--ln);text-align:center;color:var(--td);font-size:13px}
@media(max-width:900px){.notes-layout{grid-template-columns:1fr}.toc{position:static;border-left:none;border-top:1px solid var(--ln);padding:14px 0;margin-top:32px}.toc-list{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 18px}}
@media(max-width:560px){.site-nav-inner{align-items:flex-start}.site-nav-inner ul{flex-wrap:wrap;justify-content:flex-end}}
</style>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/theme.css">
</head>
<body><div class="theme-decorations"></div>
<nav class="site-nav"><div class="site-nav-inner"><a class="brand" href="index.html">MYSTHIRU</a><ul><li><a href="index.html">首页</a></li><li><a href="about.html">关于</a></li><li><a href="projects.html">项目</a></li><li><a href="notes.html" class="active">随笔</a></li></ul></div></nav>
<header><div class="eyebrow">NOTES</div><h1>随笔记录</h1><p>一些想法、碎片和不太成形的东西</p></header>
<div class="notes-layout"><div class="notes-main">
<div class="search-wrap"><span class="search-icon">🔍</span><input id="note-search" type="search" placeholder="搜索标题、正文或日期…" autocomplete="off"></div>
<div class="search-count" id="search-count">全部</div>
<div class="note-list" id="note-list" data-content-root><p class="empty-state">正在读取随笔…</p></div>
</div><aside class="toc" id="toc"><div class="toc-label">目录 · CONTENTS</div><div class="toc-list" id="toc-list"><p class="toc-empty">读取中…</p></div></aside></div>
<footer><p>这里是玄明的记录页，更新得不快，但每一行都算数。</p></footer>
<script src="./assets/content.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const search = document.getElementById('note-search');
  const count = document.getElementById('search-count');
  const tocList = document.getElementById('toc-list');
  let rawNotes = [];
  const buildToc = () => {
    if (!rawNotes.length) { tocList.innerHTML = '<p class="toc-empty">还没有随笔</p>'; return; }
    tocList.innerHTML = rawNotes.map((card, i) => {
      const title = card.querySelector('h3');
      const id = card.id || 'note-' + i;
      card.id = id;
      return `<a class="toc-link" href="#${id}" data-idx="${i}">${title ? title.textContent : '未命名'}</a>`;
    }).join('');
  };
  const wait = setInterval(() => {
    if (document.querySelectorAll('.note-card').length || !document.querySelector('#note-list .empty-state')) {
      clearInterval(wait);
      rawNotes = [...document.querySelectorAll('.note-card')];
      buildToc();
      const filter = () => {
        const q = search.value.trim().toLowerCase();
        let visible = 0;
        rawNotes.forEach(card => { const match = !q || (card.textContent || '').toLowerCase().includes(q); card.classList.toggle('hidden', !match); if (match) visible++; });
        count.textContent = q ? `找到 ${visible} 篇` : `${rawNotes.length} 篇`;
        tocList.querySelectorAll('.toc-link').forEach(link => { const idx = +link.dataset.idx; link.style.display = rawNotes[idx] && rawNotes[idx].classList.contains('hidden') ? 'none' : 'block'; });
      };
      search.addEventListener('input', filter);
      filter();
      const links = tocList.querySelectorAll('.toc-link');
      const observer = new IntersectionObserver(entries => { entries.forEach(entry => { if (entry.isIntersecting) { links.forEach(l => l.classList.remove('active')); const link = tocList.querySelector(`a[href="#${entry.target.id}"]`); if (link) link.classList.add('active'); } }); }, { rootMargin: '-20% 0px -70% 0px' });
      rawNotes.forEach(card => observer.observe(card));
    }
  }, 200);
});
</script>
<script src="./assets/backtotop.js" defer></script>
<script src="./assets/theme-switcher.js" defer></script>
</body></html>
