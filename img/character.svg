<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="原创二次元风格装饰插画">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1533"/>
      <stop offset="100%" stop-color="#0b0e1a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c6cf0"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7cf7"/>
      <stop offset="100%" stop-color="#5b4bc4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b7cf7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="500" rx="24" fill="url(#bg)"/>

  <!-- 背景光晕 -->
  <circle cx="320" cy="90" r="90" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="70" cy="420" r="110" fill="url(#glow)" filter="url(#soft)"/>

  <!-- 星星点缀 -->
  <g fill="#c4b5fd">
    <path d="M330 70l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" opacity="0.9"/>
    <path d="M60 120l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5z" opacity="0.6"/>
    <path d="M348 200l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" opacity="0.7"/>
    <path d="M52 260l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" opacity="0.5"/>
    <circle cx="290" cy="150" r="2" opacity="0.8"/>
    <circle cx="110" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="370" cy="320" r="2" opacity="0.6"/>
    <circle cx="35" cy="180" r="1.5" opacity="0.5"/>
  </g>

  <!-- 月亮 -->
  <g transform="translate(325,60)">
    <circle r="18" fill="#c4b5fd" opacity="0.25"/>
    <path d="M-6 -12a16 16 0 0 1 12 22 14 14 0 1 1 -12 -22z" fill="#e9e4ff" opacity="0.9"/>
  </g>

  <!-- 角色：头发后层 -->
  <path d="M160 130 Q120 150 118 210 Q112 300 150 360 L155 250 Z" fill="url(#hair)" opacity="0.8"/>
  <path d="M240 130 Q280 150 282 210 Q288 300 250 360 L245 250 Z" fill="url(#hair)" opacity="0.8"/>

  <!-- 角色：身体/裙子 -->
  <path d="M150 320 Q140 400 130 470 L270 470 Q260 400 250 320 Z" fill="url(#dress)"/>
  <path d="M150 320 Q150 380 175 410 Q200 430 200 440 L200 470 L160 470 Q170 430 165 390 Z" fill="#6d5ce0" opacity="0.6"/>

  <!-- 领口蝴蝶结 -->
  <g transform="translate(200,315)">
    <path d="M0 0 L-16 -10 L-12 8 Z" fill="#d985a2"/>
    <path d="M0 0 L16 -10 L12 8 Z" fill="#d985a2"/>
    <circle r="4" fill="#c46a88"/>
  </g>

  <!-- 角色：头部 -->
  <ellipse cx="200" cy="185" rx="58" ry="62" fill="#f6e7ff"/>

  <!-- 刘海 -->
  <path d="M142 180 Q140 120 200 112 Q260 120 258 180 Q250 130 200 128 Q150 130 142 180 Z" fill="url(#hair)"/>
  <path d="M146 168 Q158 138 185 132 L182 158 Q165 160 154 178 Z" fill="url(#hair)"/>
  <path d="M254 168 Q242 138 215 132 L218 158 Q235 160 246 178 Z" fill="url(#hair)"/>
  <path d="M175 124 Q200 116 225 124 L222 148 Q200 140 178 148 Z" fill="url(#hair)" opacity="0.85"/>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="176" cy="192" rx="13" ry="15" fill="#4c3f9e"/>
    <ellipse cx="224" cy="192" rx="13" ry="15" fill="#4c3f9e"/>
    <ellipse cx="178" cy="189" rx="8" ry="9" fill="#8b7cf7"/>
    <ellipse cx="222" cy="189" rx="8" ry="9" fill="#8b7cf7"/>
    <circle cx="181" cy="186" r="3" fill="#ffffff"/>
    <circle cx="219" cy="186" r="3" fill="#ffffff"/>
    <path d="M163 196 Q176 200 189 196" stroke="#3a2f7d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M211 196 Q224 200 237 196" stroke="#3a2f7d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 脸颊红晕 -->
  <ellipse cx="160" cy="206" rx="9" ry="4" fill="#f0a8c0" opacity="0.5"/>
  <ellipse cx="240" cy="206" rx="9" ry="4" fill="#f0a8c0" opacity="0.5"/>

  <!-- 嘴巴 -->
  <path d="M192 205 Q200 212 208 205" stroke="#b06a8a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 头饰：小星星发夹 -->
  <g transform="translate(245,140) rotate(15)">
    <path d="M0 -7l2 4.5 5 0.5-3.5 3 1 5L0 8l-4.5 2.5 1-5-3.5-3 5-0.5z" fill="#d985a2"/>
  </g>
  <g transform="translate(155,138) rotate(-15)">
    <circle r="3.5" fill="#d985a2"/>
  </g>

  <!-- 飘浮音符 -->
  <g fill="#a78bfa">
    <path d="M300 280l0 -16 10 -3 0 13 -6 2 0 8a4 4 0 1 1 -4 -4z" opacity="0.8"/>
    <path d="M95 330l0 -12 8 -2 0 10 -5 1.5 0 6a3 3 0 1 1 -3 -3z" opacity="0.6"/>
  </g>

  <!-- 底部装饰线 -->
  <line x1="90" y1="478" x2="310" y2="478" stroke="#8b7cf7" stroke-width="1.5" opacity="0.4"/>
  <path d="M140 468 Q200 458 260 468" stroke="#d985a2" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>