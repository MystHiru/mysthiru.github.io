<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目 - 玄明</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --surface-4: #1E2636;
      --accent: #9D7BFF;
      --accent-muted: #6B5B95;
      --text-primary: #E8E8F0;
      --text-secondary: #A8A8B8;
      --text-dim: #6B6B7B;
      --line: #282C38;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 999px;
      --gap: clamp(1rem, 2.5vw, 1.5rem);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", Consolas, "Liberation Mono", monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    nav {
      background: var(--surface-1);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: var(--gap);
      padding: 1rem clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
    }
    nav a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: var(--accent); }
    
    main {
      flex: 1;
      padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    h1 {
      font-size: clamp(2rem, 4vw, 2.5rem);
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      color: var(--text-dim);
      margin-bottom: 3rem;
    }
    
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    .project-card {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .project-card:hover {
      border-color: var(--accent-muted);
      transform: translateY(-2px);
    }
    
    .project-card h3 {
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: 600;
    }
    
    .project-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      flex: 1;
    }
    
    .project-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    
    .project-tag {
      background: var(--surface-2);
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
    }
    
    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }
    
    footer {
      margin-top: auto;
      padding: 2rem clamp(1.5rem, 5vw, 3rem);
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.9rem;
    }
    
    @media (max-width: 760px) {
      nav ul { flex-wrap: wrap; justify-content: center; }
      .project-grid { grid-template-columns: 1fr; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">首页</a></li>
      <li><a href="about.html">关于</a></li>
      <li><a href="projects.html" class="active">项目</a></li>
      <li><a href="notes.html">随笔</a></li>
    </ul>
  </nav>
  
  <main>
    <h1>项目展示</h1>
    <p class="subtitle">这里会放一些真正做过、也愿意继续维护的东西</p>
    
    <div class="empty-state">
      <h2>🚧 建设中</h2>
      <p>项目正在整理，很快就会更新在这里。</p>
      <p style="margin-top:1rem;"><a href="https://github.com/MystHiru" style="color:var(--accent);text-decoration:none;">→ 可以先去 GitHub 看看</a></p>
    </div>
    
    <!-- 示例项目卡片，实际使用时取消注释并填入内容
    <div class="project-grid">
      <div class="project-card">
        <h3>项目名称</h3>
        <p>项目的简短描述，说明它是做什么的，解决了什么问题。</p>
        <div class="project-meta">
          <span class="project-tag">Python</span>
          <span class="project-tag">自动化</span>
        </div>
      </div>
    </div>
    -->
  </main>
  
  <footer>
    <p>这里是玄明的记录页，更新得不快，但每一行都算数。</p>
  </footer>
</body>
</html>
