<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目 - 玄明</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --accent: #9D7BFF;
      --accent-muted: #6B5B95;
      --text-primary: #E8E8F0;
      --text-secondary: #A8A8B8;
      --text-dim: #6B6B7B;
      --line: #282C38;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-full: 999px;
      --gap: clamp(1rem, 2.5vw, 1.5rem);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--surface-0);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: clamp(0.95rem, 1.8vw, 1.05rem);
      line-height: 1.7;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }
    a { color: inherit; }
    nav {
      background: rgba(10,13,18,.85);
      border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px);
    }
    nav ul {
      display: flex; list-style: none; gap: var(--gap);
      padding: 1rem clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px; margin: 0 auto;
    }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
    nav a:hover, nav a.active { color: var(--accent); }
    main {
      flex: 1;
      padding: clamp(2rem, 5vw, 4rem) clamp(1.5rem, 5vw, 3rem);
      max-width: 1200px; margin: 0 auto; width: 100%;
    }
    h1 {
      font-size: clamp(2rem, 4vw, 2.5rem); font-weight: 600; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { color: var(--text-dim); margin-bottom: 3rem; }
    .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .project-card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1.5rem; transition: all 0.2s; display: flex; flex-direction: column; gap: 1rem; }
    .project-card:hover { border-color: var(--accent-muted); transform: translateY(-2px); }
    .project-card h3 { color: var(--accent); font-size: 1.2rem; font-weight: 600; }
    .project-card h3 a { color:inherit; text-decoration:none; }
    .project-card h3 a:hover { text-decoration:underline; }
    .empty-state { color:var(--text-dim); padding:2rem 0; }
    .project-card p { color: var(--text-secondary); font-size: 0.95rem; flex: 1; }
    .project-meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-dim); }
    .project-tag { background: var(--surface-2); padding: 0.3rem 0.8rem; border-radius: var(--radius-full); border: 1px solid var(--line); }
    footer { margin-top: auto; padding: 2rem clamp(1.5rem, 5vw, 3rem); border-top: 1px solid var(--line); text-align: center; color: var(--text-dim); font-size: 0.9rem; }
    @media (max-width: 760px) { nav ul { flex-wrap: wrap; justify-content: center; } .project-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation: none !important; transition: none !important; } }
  </style>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/theme.css">
</head>
<body>
  <nav class="site-nav"><div class="site-nav-inner"><a class="brand" href="index.html">MYSTHIRU</a><ul><li><a href="index.html">首页</a></li><li><a href="about.html">关于</a></li><li><a href="projects.html" class="active">项目</a></li><li><a href="notes.html">随笔</a></li></ul></div></nav>
  <main>
    <h1>项目展示</h1>
    <p class="subtitle">这里会放一些真正做过、也愿意继续维护的东西</p>
    <div class="project-grid" id="project-grid" data-content-root><p class="empty-state">正在读取项目…</p></div>
  </main>
  <footer>
    <p>这里是玄明的记录页，更新得不快，但每一行都算数。</p>
  </footer>
  <script src="./assets/content.js" defer></script>
<script src="./assets/backtotop.js" defer></script>
<script src="./assets/theme-switcher.js" defer></script>
</body>
</html>
