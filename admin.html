<head>

  <title>管理面板 · 玄明</title>
  <style>
    
:root{--s0:#080812;--s1:#0f0b16;--s2:#171126;--s3:#1f1835;--a:var(--accent);--am:var(--accent-alt);--tp:var(--text);--ts:var(--text-dim);--td:var(--text-muted);--ln:var(--line);--ok:#72d391;--bad:#e56b6b;--r:14px;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--s0);color:var(--tp);font-family:var(--f);font-size:16px;line-height:1.6;min-height:100vh}button,input,textarea{font:inherit}nav{position:sticky;top:0;z-index:20;background:rgba(10,13,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav-inner{max-width:1200px;margin:auto;padding:12px clamp(18px,5vw,44px);display:flex;justify-content:space-between;align-items:center}.nav-brand{color:var(--accent);font-weight:700;letter-spacing:.12em;text-decoration:none}main{max-width:1200px;margin:auto;padding:22px clamp(18px,5vw,44px) 70px}.connect{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.connect input{flex:1;min-width:220px}.hint{font-size:12px;color:var(--td)}input,textarea,select{width:100%;color:var(--tp);background:var(--s2);border:1px solid var(--ln);border-radius:9px;padding:9px 11px}textarea{resize:vertical;min-height:72px}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--am)}.btn{border:0;border-radius:999px;padding:8px 15px;cursor:pointer;background:var(--a);color:var(--s0);font-weight:600;text-decoration:none}.btn:hover{filter:brightness(.9)}.btn.ghost{background:var(--s2);color:var(--tp);border:1px solid var(--ln)}.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}.btn.small{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:default}.tabs{display:flex;gap:5px;overflow:auto;margin:22px 0 16px}.tab{white-space:nowrap;padding:9px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--s1);color:var(--td);cursor:pointer}.tab.active{color:var(--a);border-color:var(--am);background:var(--s2)}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar .spacer{flex:1}.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:15px;margin-bottom:12px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.card-head strong{color:var(--a)}.actions{display:flex;gap:5px;flex-wrap:wrap}.fields{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switch{display:flex;gap:8px;align-items:center;color:var(--ts)}.switch input{width:auto}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.photo{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:8px}.photo.dragging{opacity:.4}.collection-placeholder{display:grid;place-items:center;width:100%;aspect-ratio:3/2;border-radius:8px;background:linear-gradient(135deg,var(--s2),var(--s3));font-size:42px;color:var(--a);margin-bottom:8px}.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--s2);margin-bottom:8px}.photo .photo-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.drop{border:1.5px dashed var(--ln);border-radius:var(--r);padding:24px;text-align:center;color:var(--td);cursor:pointer;margin-bottom:14px}.drop.over{border-color:var(--a);background:var(--s2)}.drop input{display:none}.preview{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px;margin-top:10px;color:var(--ts)}.preview>*+*{margin-top:12px}.preview h1,.preview h2,.preview h3,.preview h4{color:var(--tp)}.preview a{color:var(--a)}.preview code{background:var(--s2);padding:2px 5px;border-radius:5px}.preview pre{overflow:auto;background:var(--s2);padding:12px;border-radius:9px}.preview blockquote{border-left:3px solid var(--a);padding-left:12px}.preview ul{padding-left:20px}.status{min-height:24px;margin:10px 0}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.status.busy{color:var(--a)}.empty{color:var(--td);padding:30px;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:18px}.stat b{display:block;font-size:24px;color:var(--a)}label{font-size:12px;color:var(--td)}@media(max-width:650px){.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}.nav span{display:none}}
  
.compact-photo{padding:10px}.photo-overview{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:start}.compact-photo .photo-overview>img,.compact-photo .collection-placeholder{width:82px;height:105px;aspect-ratio:auto;margin:0}.photo-primary{min-width:0}.compact-row{grid-template-columns:minmax(82px,.75fr) minmax(110px,1.25fr)}.advanced-editor{margin-top:9px;border-top:1px solid var(--ln);padding-top:8px}.advanced-editor summary{cursor:pointer;color:var(--td);font-size:12px;list-style:none;display:flex;align-items:center;justify-content:space-between}.advanced-editor summary::-webkit-details-marker{display:none}.advanced-editor summary::after{content:'＋';color:var(--a)}.advanced-editor[open] summary::after{content:'－'}.advanced-fields{margin-top:9px}.compact-photo .photo-actions{border-top:1px solid var(--ln);padding-top:9px;margin-top:9px}@media(max-width:620px){.photo-overview{grid-template-columns:68px 1fr}.compact-photo .photo-overview>img,.compact-photo .collection-placeholder{width:68px;height:88px}.compact-row{grid-template-columns:1fr}}

.collection-browser-bar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,minmax(110px,auto));gap:9px;align-items:end;margin:14px 0}.collection-browser-bar label{display:grid;gap:4px}.collection-search{height:40px}.group-toggle-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.collection-browser{display:grid;gap:14px}.collection-admin-group{background:rgba(16,14,28,.48);border:1px solid var(--ln);border-radius:14px;overflow:hidden}.collection-admin-group>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;padding:14px 16px;list-style:none}.collection-admin-group>summary::-webkit-details-marker{display:none}.collection-admin-group>summary::after{content:'＋';color:var(--a);font-size:16px}.collection-admin-group[open]>summary::after{content:'－'}.collection-admin-group[open]>summary{border-bottom:1px solid var(--ln)}.group-summary-main{min-width:0}.group-summary-main strong{display:block;color:var(--accent-bright);font-size:15px}.group-summary-main span{display:block;color:var(--td);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.group-summary-count{color:var(--td);font-size:12px;white-space:nowrap;margin-left:auto}.collection-card-grid{display:grid;gap:10px;padding:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.collection-card-grid.cols-1{grid-template-columns:1fr}.collection-card-grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.collection-card-grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.collection-overview-head{display:flex;justify-content:space-between;align-items:center;color:var(--td);font-size:12px;padding:3px 2px}.collection-no-result{padding:45px 20px;text-align:center;color:var(--td);border:1px dashed var(--ln);border-radius:14px}.compact-photo{margin:0}.sort-disabled .manual-order-action{display:none}@media(max-width:850px){.collection-browser-bar{grid-template-columns:1fr 1fr}.collection-search{grid-column:1/-1}.collection-card-grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.collection-browser-bar{grid-template-columns:1fr}.collection-search{grid-column:auto}.collection-card-grid,.collection-card-grid.cols-2,.collection-card-grid.cols-3{grid-template-columns:1fr}.group-toggle-bar .hint{width:100%}}
</style>

<body><div class="theme-decorations"></div>
<nav><div class="nav-inner"><a class="nav-brand" href="index.html">MYSTHIRU</a><span class="hint" style="color:var(--td);font-size:.82rem;">CONTENT CONTROL</span></div></nav>
<main>
  <div class="connect"><input id="token" type="password" placeholder="Fine-grained Token（仓库 Contents 读写）" autocomplete="off"><button class="btn" id="connect">连接</button><button class="btn ghost" id="undo" disabled>撤销最近一次内容修改</button><a class="btn ghost" href="index.html" target="_blank">预览网站</a></div>
  <p class="hint">Token 保存在当前浏览器。内容保存前自动写入 data/content.previous.json。</p><div id="status" class="status"></div>
  <div class="tabs"><button class="tab active" data-tab="home">概览</button><button class="tab" data-tab="gallery">收藏</button><button class="tab" data-tab="notes">随笔</button><button class="tab" data-tab="projects">项目</button><button class="tab" data-tab="text">页面文字</button></div>
  <section class="panel active" id="panel-home"><div class="stats"><div class="stat"><span>收藏</span><b id="stat-gallery">—</b></div><div class="stat"><span>公开随笔</span><b id="stat-notes">—</b></div><div class="stat"><span>公开项目</span><b id="stat-projects">—</b></div></div><div class="card" style="margin-top:14px"><strong>说明</strong><p class="hint" style="margin-top:8px">收藏可按类型、分类和标签整理；图片可拖动排序、重命名和移入回收区；随笔支持 Markdown、预览和草稿；项目支持链接与发布状态。</p></div></section>
  <section class="panel" id="panel-gallery">
  <div class="drop" id="drop">点击或拖入图片；上传前自动压缩<input id="files" type="file" accept="image/*" multiple></div>
  <div class="toolbar"><button class="btn ghost" id="add-collection">＋ 新建非图片收藏</button><button class="btn" id="save-gallery">保存收藏</button><span class="spacer"></span><span class="hint" id="collection-visible-count">0 项</span></div>
  <div class="collection-browser-bar">
    <input id="collection-search" class="collection-search" type="search" placeholder="搜索标题、分组、分类、标签或说明">
    <label>视图<select id="collection-view"><option value="group">按分组</option><option value="all">全部概览</option></select></label>
    <label>排列<select id="collection-columns"><option value="auto">自动</option><option value="1">一列</option><option value="2">两列</option><option value="3">三列</option></select></label>
    <label>分类<select id="collection-category"><option value="all">全部分类</option></select></label><label>类型<select id="collection-type"><option value="all">全部类型</option></select></label><label>排序<select id="collection-sort"><option value="manual">手动顺序</option><option value="title">按标题</option><option value="category">按分类</option><option value="type">按类型</option></select></label>
  </div>
  <div class="group-toggle-bar" id="group-toggle-bar"><button class="btn ghost small" id="expand-groups">全部展开</button><button class="btn ghost small" id="collapse-groups">全部收起</button><span class="hint">分组状态会保存在当前浏览器</span></div>
  <div id="gallery-editor" class="collection-browser"></div>
</section>
  <section class="panel" id="panel-notes"><div class="toolbar"><button class="btn ghost" id="add-note">＋ 新随笔</button><button class="btn" id="save-notes">保存随笔</button><span class="spacer"></span><a class="btn ghost small" href="notes.html" target="_blank">打开随笔页</a></div><div id="notes-editor"></div></section>
  <section class="panel" id="panel-projects"><div class="toolbar"><button class="btn ghost" id="add-project">＋ 新项目</button><button class="btn" id="save-projects">保存项目</button><span class="spacer"></span><a class="btn ghost small" href="projects.html" target="_blank">打开项目页</a></div><div id="projects-editor"></div></section>
  <section class="panel" id="panel-text"><div class="toolbar"><button class="btn" id="save-text">保存页面文字</button></div><div id="text-editor"><p class="empty">连接后读取首页和关于页可编辑文字。</p></div></section>
</main>
<script src="./assets/content.js"></script>
<script>
const OWNER='MystHiru',REPO='mysthiru.github.io',BRANCH='main',DATA='data/content.json',BACKUP='data/content.previous.json',IMG='img/archive',TRASH='img/trash';
const $=id=>document.getElementById(id);let data=null,dataSha=null,dragIndex=null,textFields={};let collectionView=localStorage.getItem('mh_collection_view')||'group',collectionColumns=localStorage.getItem('mh_collection_columns')||'auto',collectionSort=localStorage.getItem('mh_collection_sort')||'manual',collectionSearch='',collectionCategory='all',collectionType='all',collapsedGroups=new Set(JSON.parse(localStorage.getItem('mh_collapsed_groups')||'[]'));
function token(){return $('token').value.trim()}function status(m,c=''){const e=$('status');e.textContent=m;e.className='status '+c}function encodeText(s){return btoa(unescape(encodeURIComponent(s)))}function decodeText(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
async function api(path,method='GET',body=null){const o={method,headers:{Authorization:'Bearer '+token(),Accept:'application/vnd.github+json'}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch('https://api.github.com'+path,o);if(!r.ok){let m='HTTP '+r.status;try{m=(await r.json()).message||m}catch{}throw Error(m)}return r.status===204?null:r.json()}async function getFile(path){return api(`/repos/${OWNER}/${REPO}/contents/${path}`)}async function putFile(path,content,message,sha){return api(`/repos/${OWNER}/${REPO}/contents/${path}`,'PUT',{message,content:encodeText(content),sha,branch:BRANCH})}async function putBase64(path,content,message,sha){return api(`/repos/${OWNER}/${REPO}/contents/${path}`,'PUT',{message,content,sha,branch:BRANCH})}async function deleteFile(path,sha,message){return api(`/repos/${OWNER}/${REPO}/contents/${path}`,'DELETE',{message,sha,branch:BRANCH})}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'"').replace(/'/g,'&#39;')}function slug(s){return String(s||'item').toLowerCase().trim().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'item-'+Date.now()}
async function saveData(message){status('正在备份并保存…','busy');const current=await getFile(DATA);const old=decodeText(current.content);let backupSha;try{backupSha=(await getFile(BACKUP)).sha}catch{}await putFile(BACKUP,old,'Backup content before change',backupSha);data.updatedAt=new Date().toISOString();const result=await putFile(DATA,JSON.stringify(data,null,2),message,current.sha);dataSha=result.content.sha;$('undo').disabled=false;renderAll();status('已保存，Pages 更新通常需要几十秒','ok')}
async function load(){if(!token())return status('请输入 Token','bad');status('正在读取…','busy');const meta=await getFile(DATA);data=JSON.parse(decodeText(meta.content));dataSha=meta.sha;try{await getFile(BACKUP);$('undo').disabled=false}catch{$('undo').disabled=true}await loadText();renderAll();status('已连接','ok')}
function renderAll(){renderStats();renderGallery();renderNotes();renderProjects()}function renderStats(){$('stat-gallery').textContent=data.collections.length;$('stat-notes').textContent=data.notes.filter(x=>x.published).length;$('stat-projects').textContent=data.projects.filter(x=>x.published).length}
function captureInputs(){if(!data)return;document.querySelectorAll('[data-note-index]').forEach(c=>{const i=+c.dataset.noteIndex;if(data.notes[i])data.notes[i]={...data.notes[i],title:c.querySelector('.n-title').value,date:c.querySelector('.n-date').value,body:c.querySelector('.n-body').value,published:c.querySelector('.n-pub').checked}});document.querySelectorAll('[data-project-index]').forEach(c=>{const i=+c.dataset.projectIndex;if(data.projects[i])data.projects[i]={...data.projects[i],name:c.querySelector('.p-name').value,description:c.querySelector('.p-desc').value,url:c.querySelector('.p-url').value,tags:c.querySelector('.p-tags').value.split(',').map(x=>x.trim()).filter(Boolean),published:c.querySelector('.p-pub').checked}});document.querySelectorAll('[data-gallery-index]').forEach(c=>{const i=+c.dataset.galleryIndex;if(data.collections[i])data.collections[i]={...data.collections[i],title:c.querySelector('.g-title').value,type:c.querySelector('.g-type').value,category:c.querySelector('.g-category').value,group:c.querySelector('.g-group').value,groupDescription:c.querySelector('.g-group-desc').value,tags:c.querySelector('.g-tags').value.split(',').map(x=>x.trim()).filter(Boolean),url:c.querySelector('.g-url').value,description:c.querySelector('.g-desc').value}})}
function move(arr,i,d){captureInputs();const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];renderAll()}
function collectionGridClass(){return collectionColumns==='auto'?'collection-card-grid':`collection-card-grid cols-${collectionColumns}`}
function collectionHaystack(item){return [item.title,item.type,item.category,item.group,item.groupDescription,item.description,item.url,...(item.tags||[])].join(' ').toLowerCase()}
function collectionEntries(){
 const query=collectionSearch.trim().toLowerCase();
 let entries=data.collections.map((item,index)=>({item,index})).filter(({item})=>(!query||collectionHaystack(item).includes(query))&&(collectionCategory==='all'||(item.category||'其他')===collectionCategory)&&(collectionType==='all'||(item.type||'text')===collectionType));
 if(collectionSort==='title')entries.sort((a,b)=>(a.item.title||'').localeCompare(b.item.title||'','zh-CN'));
 if(collectionSort==='category')entries.sort((a,b)=>(a.item.category||'').localeCompare(b.item.category||'','zh-CN')||(a.item.title||'').localeCompare(b.item.title||'','zh-CN'));
 if(collectionSort==='type')entries.sort((a,b)=>(a.item.type||'').localeCompare(b.item.type||'')||(a.item.title||'').localeCompare(b.item.title||'','zh-CN'));
 return entries;
}
function collectionCard(g,i){
 return `<article class="photo compact-photo ${collectionSort!=='manual'?'sort-disabled':''}" draggable="${collectionSort==='manual'}" data-gallery-index="${i}">
   <div class="photo-overview">
     ${g.type==='image'&&g.file?`<img src="./img/archive/${encodeURIComponent(g.file)}?v=${Date.now()}" alt="">`:`<div class="collection-placeholder">${g.type==='music'?'♫':g.type==='video'?'▶':g.type==='link'?'↗':'✦'}</div>`}
     <div class="photo-primary fields"><input class="g-title" value="${esc(g.title)}" placeholder="标题"><div class="row compact-row"><select class="g-type"><option value="image" ${g.type==='image'?'selected':''}>图片</option><option value="link" ${g.type==='link'?'selected':''}>链接</option><option value="text" ${g.type==='text'?'selected':''}>文字</option><option value="music" ${g.type==='music'?'selected':''}>音乐</option><option value="video" ${g.type==='video'?'selected':''}>视频</option></select><input class="g-category" value="${esc(g.category||'其他')}" placeholder="分类，如二次元"></div></div>
   </div>
   <details class="advanced-editor"><summary>分组、标签与更多信息</summary><div class="fields advanced-fields"><input class="g-group" value="${esc(g.group||g.category||'其他')}" placeholder="分组，如紫调角色图包"><input class="g-group-desc" value="${esc(g.groupDescription||'')}" placeholder="分组说明（可选）"><input class="g-tags" value="${esc((g.tags||[]).join(', '))}" placeholder="标签，用逗号分隔"><input class="g-url" value="${esc(g.url||'')}" placeholder="链接（可选）"><textarea class="g-desc" placeholder="简短说明">${esc(g.description||'')}</textarea></div></details>
   <div class="photo-actions"><button class="btn ghost small manual-order-action" onclick="move(data.collections,${i},-1)">↑</button><button class="btn ghost small manual-order-action" onclick="move(data.collections,${i},1)">↓</button>${g.type==='image'&&g.file?`<button class="btn ghost small" onclick="renamePhoto(${i})">重命名</button>`:''}<button class="btn ghost small" onclick="duplicateCollection(${i})">复制</button><button class="btn danger small" onclick="trashPhoto(${i})">删除</button></div>
 </article>`;
}
function bindCollectionDrag(root){
 if(collectionSort!=='manual')return;
 root.querySelectorAll('.photo').forEach(el=>{el.ondragstart=e=>{if(e.target.closest('input,textarea,select,button,details')){e.preventDefault();return}captureInputs();dragIndex=+el.dataset.galleryIndex;el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const to=+el.dataset.galleryIndex;if(dragIndex===null||dragIndex===to)return;const[item]=data.collections.splice(dragIndex,1);data.collections.splice(to,0,item);dragIndex=null;renderGallery()}})
}
function updateCollectionFilterOptions(){
 const category=$('collection-category'),type=$('collection-type');
 const categories=[...new Set(data.collections.map(x=>x.category||'其他'))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
 const types=[...new Set(data.collections.map(x=>x.type||'text'))].sort();
 category.innerHTML='<option value="all">全部分类</option>'+categories.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 type.innerHTML='<option value="all">全部类型</option>'+types.map(x=>`<option value="${esc(x)}">${{image:'图片',link:'链接',text:'文字',music:'音乐',video:'视频'}[x]||esc(x)}</option>`).join('');
 category.value=categories.includes(collectionCategory)?collectionCategory:'all'; type.value=types.includes(collectionType)?collectionType:'all'; collectionCategory=category.value; collectionType=type.value;
}
function duplicateCollection(i){captureInputs();const copy=typeof structuredClone==='function'?structuredClone(data.collections[i]):JSON.parse(JSON.stringify(data.collections[i]));copy.id='collection-'+Date.now();copy.title=(copy.title||'未命名收藏')+' · 副本';data.collections.splice(i+1,0,copy);renderGallery()}
function renderGallery(){
 const root=$('gallery-editor'); if(!data)return; updateCollectionFilterOptions();
 const entries=collectionEntries(); $('collection-visible-count').textContent=`${entries.length} / ${data.collections.length} 项`;
 $('group-toggle-bar').style.display=collectionView==='group'?'flex':'none';
 if(!entries.length){const empty=data.collections.length===0;root.innerHTML=empty?'<div class="archive-empty"><span class="empty-mark">✦</span><h2>收藏管理还是空的</h2><p>可以从上方上传图片，或新建链接、文字、音乐与视频收藏。</p></div>':'<div class="collection-no-result">没有找到符合当前搜索与筛选条件的收藏</div>';$('group-toggle-bar').style.display='none';return}
 if(collectionView==='all'){
   root.innerHTML=`<div class="collection-overview-head"><span>全部概览</span><span>${entries.length} 项 · ${collectionSort==='manual'?'手动顺序':'显示排序'}</span></div><div class="${collectionGridClass()}">${entries.map(({item,index})=>collectionCard(item,index)).join('')}</div>`;
 }else{
   const map=new Map(); entries.forEach(entry=>{const name=entry.item.group||entry.item.category||'未分组';if(!map.has(name))map.set(name,[]);map.get(name).push(entry)});
   root.innerHTML=[...map].map(([name,groupEntries])=>{const sample=groupEntries[0].item,closed=collapsedGroups.has(name);return `<details class="collection-admin-group" data-admin-group="${esc(name)}" ${closed?'':'open'}><summary><div class="group-summary-main"><strong>${esc(name)}</strong><span>${esc(sample.groupDescription||'未填写分组说明')}</span></div><span class="group-summary-count">${groupEntries.length} 项</span></summary><div class="${collectionGridClass()}">${groupEntries.map(({item,index})=>collectionCard(item,index)).join('')}</div></details>`}).join('');
   root.querySelectorAll('.collection-admin-group').forEach(group=>group.addEventListener('toggle',()=>{const name=group.dataset.adminGroup;if(group.open)collapsedGroups.delete(name);else collapsedGroups.add(name);localStorage.setItem('mh_collapsed_groups',JSON.stringify([...collapsedGroups]))}));
 }
 bindCollectionDrag(root);
}
async function renamePhoto(i){captureInputs();const item=data.collections[i],ext=item.file.includes('.')?'.'+item.file.split('.').pop():'.jpg',base=prompt('新的文件名（无需扩展名）',item.file.replace(/\.[^.]+$/,''));if(!base)return;const next=slug(base)+ext;if(next===item.file)return;status('正在重命名…','busy');const old=await getFile(`${IMG}/${item.file}`);await putBase64(`${IMG}/${next}`,old.content.replace(/\s/g,''),`Rename ${item.file}`);await deleteFile(`${IMG}/${item.file}`,old.sha,`Remove ${item.file}`);item.file=next;await saveData('Rename gallery image')}
async function trashPhoto(i){captureInputs();const item=data.collections[i];if(!confirm(`删除收藏「${item.title}」？`))return;if(item.type==='image'&&item.file){status('正在移动图片到回收区…','busy');const old=await getFile(`${IMG}/${item.file}`),trashName=`${Date.now()}-${item.file}`;await putBase64(`${TRASH}/${trashName}`,old.content.replace(/\s/g,''),`Trash ${item.file}`);await deleteFile(`${IMG}/${item.file}`,old.sha,`Remove ${item.file}`)}data.collections.splice(i,1);await saveData('Remove collection item')}
function compress(file){return new Promise((ok,bad)=>{const im=new Image;im.onload=()=>{let w=im.width,h=im.height,max=1600;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(im.src);ok(c.toDataURL('image/jpeg',.84).split(',')[1])};im.onerror=bad;im.src=URL.createObjectURL(file)})}async function upload(files){for(const file of [...files].filter(x=>x.type.startsWith('image/'))){status('正在上传 '+file.name,'busy');const content=await compress(file),name=`img-${Date.now()}-${Math.random().toString(36).slice(2,6)}.jpg`;await putBase64(`${IMG}/${name}`,content,`Upload ${name}`);data.collections.push({id:'collection-'+Date.now()+'-'+Math.random().toString(36).slice(2,5),type:'image',title:file.name.replace(/\.[^.]+$/,''),category:'二次元',group:'未分组',groupDescription:'',tags:['图片'],file:name,url:'',description:''})}await saveData('Upload gallery images')}
function renderNotes(){const root=$('notes-editor');if(!data.notes.length){root.innerHTML='<p class="empty">暂无随笔</p>';return}root.innerHTML=data.notes.map((n,i)=>`<div class="card" data-note-index="${i}"><div class="card-head"><strong>#${i+1}</strong><div class="actions"><button class="btn ghost small" onclick="move(data.notes,${i},-1)">↑</button><button class="btn ghost small" onclick="move(data.notes,${i},1)">↓</button><button class="btn ghost small" onclick="previewNote(${i})">预览</button><button class="btn danger small" onclick="deleteNote(${i})">删除</button></div></div><div class="fields"><input class="n-title" value="${esc(n.title)}" placeholder="标题"><div class="row"><input class="n-date" type="date" value="${esc(n.date)}"><label class="switch"><input class="n-pub" type="checkbox" ${n.published?'checked':''}> 发布</label></div><textarea class="n-body" rows="9" placeholder="支持 Markdown">${esc(n.body)}</textarea><div class="preview" id="note-preview-${i}" style="display:none"></div></div></div>`).join('')}function previewNote(i){captureInputs();const e=$(`note-preview-${i}`);e.innerHTML=window.MystContent.markdown(data.notes[i].body);e.style.display=e.style.display==='none'?'block':'none'}function deleteNote(i){captureInputs();if(confirm('删除这篇随笔？')){data.notes.splice(i,1);renderNotes()}}
function renderProjects(){const root=$('projects-editor');if(!data.projects.length){root.innerHTML='<p class="empty">暂无项目</p>';return}root.innerHTML=data.projects.map((p,i)=>`<div class="card" data-project-index="${i}"><div class="card-head"><strong>#${i+1}</strong><div class="actions"><button class="btn ghost small" onclick="move(data.projects,${i},-1)">↑</button><button class="btn ghost small" onclick="move(data.projects,${i},1)">↓</button><button class="btn danger small" onclick="deleteProject(${i})">删除</button></div></div><div class="fields"><input class="p-name" value="${esc(p.name)}" placeholder="项目名称"><textarea class="p-desc" placeholder="项目描述">${esc(p.description)}</textarea><input class="p-url" value="${esc(p.url||'')}" placeholder="https://github.com/..."><div class="row"><input class="p-tags" value="${esc((p.tags||[]).join(', '))}" placeholder="标签，用逗号分隔"><label class="switch"><input class="p-pub" type="checkbox" ${p.published?'checked':''}> 发布</label></div></div></div>`).join('')}function deleteProject(i){captureInputs();if(confirm('删除这个项目？')){data.projects.splice(i,1);renderProjects()}}
async function loadText(){textFields={};const root=$('text-editor');root.innerHTML='';for(const page of ['index.html']){const meta=await getFile(page),html=decodeText(meta.content),re=/<!-- EDITABLE:(\w+) -->([\s\S]*?)<!-- END -->/g;let m;while((m=re.exec(html))){textFields[m[1]]={page,value:m[2].trim()};root.insertAdjacentHTML('beforeend',`<div class="card"><label>${esc(m[1])} · ${page}</label><textarea data-text-key="${esc(m[1])}">${esc(m[2].trim())}</textarea></div>`)}}}async function saveText(){status('保存页面文字…','busy');const grouped={};document.querySelectorAll('[data-text-key]').forEach(e=>{const k=e.dataset.textKey,f=textFields[k];(grouped[f.page]??=[]).push({key:k,value:e.value})});for(const[page,items]of Object.entries(grouped)){const meta=await getFile(page);let html=decodeText(meta.content);items.forEach(x=>html=html.replace(new RegExp(`<!-- EDITABLE:${x.key} -->[\\s\\S]*?<!-- END -->`),`<!-- EDITABLE:${x.key} -->${esc(x.value)}<!-- END -->`));await putFile(page,html,`Edit page text: ${page}`,meta.sha)}status('页面文字已保存','ok')}
async function undo(){if(!confirm('用上一次备份覆盖当前内容？'))return;status('正在撤销…','busy');const backup=await getFile(BACKUP),current=await getFile(DATA);await putFile(DATA,decodeText(backup.content),'Undo last content change',current.sha);await load();status('已撤销','ok')}
$('collection-view').value=collectionView;$('collection-columns').value=collectionColumns;$('collection-sort').value=collectionSort;
$('collection-search').oninput=e=>{captureInputs();collectionSearch=e.target.value;renderGallery()};
$('collection-view').onchange=e=>{captureInputs();collectionView=e.target.value;localStorage.setItem('mh_collection_view',collectionView);renderGallery()};
$('collection-columns').onchange=e=>{captureInputs();collectionColumns=e.target.value;localStorage.setItem('mh_collection_columns',collectionColumns);renderGallery()};
$('collection-sort').onchange=e=>{captureInputs();collectionSort=e.target.value;localStorage.setItem('mh_collection_sort',collectionSort);renderGallery()};
$('collection-category').onchange=e=>{captureInputs();collectionCategory=e.target.value;renderGallery()};
$('collection-type').onchange=e=>{captureInputs();collectionType=e.target.value;renderGallery()};
$('expand-groups').onclick=()=>{collapsedGroups.clear();localStorage.setItem('mh_collapsed_groups','[]');renderGallery()};
$('collapse-groups').onclick=()=>{captureInputs();data.collections.forEach(x=>collapsedGroups.add(x.group||x.category||'未分组'));localStorage.setItem('mh_collapsed_groups',JSON.stringify([...collapsedGroups]));renderGallery()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(`panel-${t.dataset.tab}`).classList.add('active')});$('connect').onclick=load;$('undo').onclick=undo;$('save-gallery').onclick=()=>{captureInputs();saveData('Update collections')};$('save-notes').onclick=()=>{captureInputs();saveData('Update notes')};$('save-projects').onclick=()=>{captureInputs();saveData('Update projects')};$('save-text').onclick=saveText;$('add-collection').onclick=()=>{captureInputs();data.collections.push({id:'collection-'+Date.now(),type:'link',title:'新收藏',category:'其他',group:'未分组',groupDescription:'',tags:[],file:'',url:'',description:''});renderGallery()};$('add-note').onclick=()=>{captureInputs();data.notes.unshift({id:'note-'+Date.now(),title:'新随笔',date:new Date().toISOString().slice(0,10),body:'',published:false});renderNotes()};$('add-project').onclick=()=>{captureInputs();data.projects.push({id:'project-'+Date.now(),name:'新项目',description:'',tags:[],url:'',published:false});renderProjects()};const drop=$('drop'),files=$('files');drop.onclick=()=>files.click();files.onchange=()=>upload(files.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');upload(e.dataTransfer.files)};try{const t=localStorage.getItem('mh_token');if(t)$('token').value=t}catch{}$('token').onchange=()=>localStorage.setItem('mh_token',token());
</script>
