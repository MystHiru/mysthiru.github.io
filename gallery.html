n-group[hidden]{display:none}.group-head{display:flex;justify-content:space-between;gap:22px;align-items:flex-end;padding:18px 0;border-top:1px solid var(--ln);margin-bottom:12px}.group-head h2{font-size:24px;margin-top:5px}.group-head p{color:var(--td);font-size:13px;margin-top:4px;max-width:570px}.group-kicker{font-size:10px;color:var(--a);letter-spacing:.13em}.group-count{color:var(--td);font-size:12px;white-space:nowrap}.group-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.collection-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.collection-card{grid-column:span 4;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;min-width:0;transition:transform .2s,border-color .2s}.collection-card:hover{transform:translateY(-3px);border-color:var(--am)}.collection-card[hidden]{display:none}.collection-media{aspect-ratio:4/5;background:var(--s2);overflow:hidden}.collection-media img{width:100%;height:100%;object-fit:cover;transition:transform .45s}.collection-card:hover img{transform:scale(1.035)}.collection-symbol{height:180px;display:grid;place-items:center;background:linear-gradient(135deg,var(--s2),var(--s3));font-size:50px;color:var(--a)}.collection-content{padding:17px}.collection-meta{display:flex;justify-content:space-between;color:var(--td);font-size:11px;letter-spacing:.08em;margin-bottom:9px}.collection-content h2{font-size:18px;line-height:1.35}.collection-content h2 a{color:inherit;text-decoration:none}.collection-content h2 a:hover{color:var(--a)}.collection-content p{color:var(--ts);font-size:13px;margin-top:8px}.collection-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.collection-tag{font-size:11px;padding:4px 8px}.empty-state{color:var(--td);padding:40px 0}footer{text-align:center;border-top:1px solid var(--ln);padding:24px;color:var(--td);font-size:13px}footer a{color:var(--ts);text-decoration:none}.deep-entry{display:block;margin-top:12px;color:rgba(255,255,255,.12);font-size:
